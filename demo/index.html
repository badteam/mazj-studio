<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bite & Delight — Sweets & Events</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=El+Messiri:wght@500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#151820; --navy2:#1e2230; --gold:#c9a24a; --gold2:#e6c97a; --cream:#f7f2e9; --paper:#fffdf9;
  --ink:#1b1d24; --muted:#6f6a62; --line:#e7dfd0; --cocoa:#4a2a20;
  --r:18px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:"IBM Plex Sans Arabic","Jost",system-ui,sans-serif;background:var(--cream);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased}
html[lang=en] body{font-family:"Jost","IBM Plex Sans Arabic",system-ui,sans-serif}
.display{font-family:"El Messiri","Cormorant Garamond",serif}
html[lang=en] .display{font-family:"Cormorant Garamond","El Messiri",serif;letter-spacing:.2px}
img{display:block;max-width:100%}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
a{color:inherit;text-decoration:none}
.wrap{max-width:1180px;margin:0 auto;padding:0 22px}

/* demo ribbon */
.demo{background:var(--gold);color:var(--navy);text-align:center;font-size:13px;font-weight:600;padding:6px 12px}

/* header */
header{position:sticky;top:0;z-index:40;background:rgba(21,24,32,.96);backdrop-filter:blur(8px);color:#fff;border-bottom:1px solid rgba(201,162,74,.25)}
.nav{display:flex;align-items:center;justify-content:space-between;height:74px;gap:16px}
.brand{display:flex;align-items:center;gap:10px}
.brand img{height:44px;width:auto}
.brand b{font-family:"Cormorant Garamond",serif;font-size:22px;letter-spacing:3px;color:var(--gold2);font-weight:600;white-space:nowrap}
.links{display:flex;gap:26px;font-size:15px;color:#d9d4c8}
.links a:hover{color:var(--gold2)}
.tools{display:flex;align-items:center;gap:10px}
.lang{border:1px solid rgba(201,162,74,.5);color:var(--gold2);border-radius:99px;padding:6px 14px;font-size:13px;font-family:"Jost",sans-serif}
.cartbtn{position:relative;background:var(--gold);color:var(--navy);border-radius:99px;padding:9px 16px;font-weight:600;display:flex;align-items:center;gap:8px;font-size:14px}
.cartbtn .n{background:var(--navy);color:var(--gold2);border-radius:99px;min-width:22px;height:22px;display:grid;place-items:center;font-size:12px;padding:0 6px}
.bump{animation:bump .35s}
@keyframes bump{50%{transform:scale(1.12)}}

/* hero */
.hero{background:var(--navy);color:#fff;overflow:hidden;position:relative}
.hero .wrap{display:grid;grid-template-columns:1.05fr .95fr;gap:40px;align-items:center;min-height:560px;padding-top:40px;padding-bottom:40px}
.eyebrow{color:var(--gold2);letter-spacing:4px;font-size:12px;text-transform:uppercase;font-family:"Jost",sans-serif;display:flex;align-items:center;gap:10px}
.eyebrow:before{content:"";width:34px;height:1px;background:var(--gold)}
.hero h1{font-size:clamp(38px,5.4vw,66px);line-height:1.15;margin:18px 0 18px;font-weight:600}
.hero h1 em{font-style:normal;color:var(--gold2)}
.hero p{color:#c9c3b6;font-size:17px;max-width:480px}
.cta{display:flex;gap:12px;margin-top:30px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;padding:14px 26px;border-radius:99px;font-weight:600;font-size:15px;transition:.2s}
.btn.gold{background:linear-gradient(135deg,var(--gold2),var(--gold));color:var(--navy)}
.btn.gold:hover{filter:brightness(1.06);transform:translateY(-1px)}
.btn.ghost{border:1px solid rgba(255,255,255,.3);color:#fff}
.btn.ghost:hover{border-color:var(--gold2);color:var(--gold2)}
.heroimg{position:relative;justify-self:center;width:min(440px,100%)}
.heroimg .frame{border-radius:220px 220px 24px 24px;overflow:hidden;border:1px solid rgba(201,162,74,.5);padding:10px;}
.heroimg .frame img{border-radius:210px 210px 16px 16px;aspect-ratio:4/5;object-fit:cover;width:100%}
.heroimg .badge{position:absolute;bottom:34px;inset-inline-start:-26px;background:var(--paper);color:var(--ink);border-radius:16px;padding:12px 16px;box-shadow:0 18px 40px rgba(0,0,0,.35);display:flex;gap:10px;align-items:center;font-size:13px}
.heroimg .badge b{display:block;font-size:15px}
.heroimg .badge i{font-style:normal;font-size:26px}
.stats{display:flex;gap:34px;margin-top:40px;color:#c9c3b6;font-size:13px}
.stats b{display:block;color:#fff;font-size:24px;font-family:"Cormorant Garamond",serif}

/* sections */
section{padding:86px 0}
.head{text-align:center;max-width:620px;margin:0 auto 40px}
.head img{height:38px;margin:0 auto 10px;width:auto}
.head h2{font-size:clamp(30px,3.6vw,44px);font-weight:600;line-height:1.2}
.head p{color:var(--muted);margin-top:10px}

/* filters + grid */
.filters{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:34px}
.chip{border:1px solid var(--line);background:var(--paper);padding:8px 18px;border-radius:99px;font-size:14px;color:var(--muted);transition:.2s}
.chip.on,.chip:hover{background:var(--navy);color:var(--gold2);border-color:var(--navy)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:22px}
.card{background:var(--paper);border-radius:var(--r);overflow:hidden;border:1px solid var(--line);display:flex;flex-direction:column;transition:.25s}
.card:hover{transform:translateY(-4px);box-shadow:0 20px 40px rgba(40,30,15,.12)}
.pic{position:relative;aspect-ratio:1/1;overflow:hidden;background:#eee}
.pic img{width:100%;height:100%;object-fit:cover;transition:.5s}
.card:hover .pic img{transform:scale(1.05)}
.pic.navy{background:radial-gradient(circle at 50% 40%,#2a3042,var(--navy));display:grid;place-items:center}
.pic.navy img{width:46%;height:auto;object-fit:contain}
.pic.navy .lbl{position:absolute;bottom:18px;left:0;right:0;text-align:center;color:var(--gold2);font-family:"Cormorant Garamond",serif;letter-spacing:3px;font-size:14px}
.tag{position:absolute;top:12px;inset-inline-start:12px;background:var(--navy);color:var(--gold2);font-size:12px;padding:4px 11px;border-radius:99px}
.body{padding:18px 18px 20px;display:flex;flex-direction:column;flex:1}
.body h3{font-size:21px;font-weight:600;line-height:1.3}
.body p{color:var(--muted);font-size:14px;margin:6px 0 14px;flex:1}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.price{font-weight:600;font-size:18px;color:var(--cocoa);font-family:"Jost",sans-serif}
.price small{font-size:12px;color:var(--muted);font-weight:500}
.add{background:var(--navy);color:var(--gold2);border-radius:99px;padding:9px 16px;font-size:14px;font-weight:500;transition:.2s}
.add:hover{background:var(--gold);color:var(--navy)}
.opts{margin:-4px 0 14px}
.opts select{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;font:inherit;font-size:14px}

/* events */
.events{background:var(--navy);color:#fff}
.events .wrap{display:grid;grid-template-columns:1fr 1fr;gap:50px;align-items:center}
.events h2{font-size:clamp(30px,3.6vw,44px);line-height:1.2;margin:14px 0}
.events p{color:#c9c3b6}
.elist{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:26px 0 30px}
.elist div{border:1px solid rgba(201,162,74,.3);border-radius:14px;padding:16px;font-size:14px;color:#ddd6c8}
.elist b{display:block;color:var(--gold2);font-size:16px;margin-bottom:2px}
.mosaic{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mosaic img{border-radius:16px;width:100%;height:220px;object-fit:cover}
.mosaic img:first-child{grid-row:span 2;height:452px}

/* steps */
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.step{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:28px;text-align:center}
.step .num{width:52px;height:52px;border-radius:50%;margin:0 auto 14px;display:grid;place-items:center;background:var(--navy);color:var(--gold2);font-family:"Cormorant Garamond",serif;font-size:24px}
.step h3{font-size:20px;margin-bottom:6px}
.step p{color:var(--muted);font-size:14px}

/* reviews */
.reviews{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.rev{background:var(--paper);border-radius:var(--r);padding:26px;border:1px solid var(--line)}
.rev .st{color:var(--gold);letter-spacing:3px}
.rev p{margin:10px 0 14px;font-size:15px}
.rev b{font-size:14px;color:var(--muted);font-weight:500}
.note{text-align:center;color:var(--muted);font-size:12px;margin-top:14px}

/* insta */
.insta{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:10px}
.insta img{aspect-ratio:1;object-fit:cover;border-radius:12px;width:100%}

/* footer */
footer{background:var(--navy);color:#bdb6a8;padding:60px 0 26px;font-size:14px}
.fgrid{display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr;gap:30px}
footer img{height:120px;width:auto;margin-bottom:8px}
footer h4{color:var(--gold2);font-size:15px;margin-bottom:12px;font-weight:600}
footer li{list-style:none;margin-bottom:8px}
footer a:hover{color:var(--gold2)}
.copy{border-top:1px solid rgba(255,255,255,.08);margin-top:40px;padding-top:20px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;font-size:12px}

/* drawer */
.ov{position:fixed;inset:0;background:rgba(10,12,18,.55);opacity:0;pointer-events:none;transition:.3s;z-index:60}
.ov.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;inset-inline-end:0;width:min(430px,100%);background:var(--paper);z-index:70;transform:translateX(-105%);transition:.35s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}
html[dir=ltr] .drawer{transform:translateX(105%)}
.drawer.on{transform:none!important}
.dh{display:flex;justify-content:space-between;align-items:center;padding:20px 22px;border-bottom:1px solid var(--line)}
.dh h3{font-size:22px}
.x{font-size:26px;line-height:1;color:var(--muted)}
.items{flex:1;overflow:auto;padding:10px 22px}
.it{display:flex;gap:12px;padding:14px 0;border-bottom:1px dashed var(--line);align-items:center}
.it img,.it .ph{width:62px;height:62px;border-radius:12px;object-fit:cover;flex:none;background:var(--navy)}
.it .ph{display:grid;place-items:center}.it .ph img{width:34px;height:auto;border-radius:0;background:none}
.it .t{flex:1;font-size:14px}
.it .t b{display:block;font-size:15px}
.it .t span{color:var(--muted);font-size:12px}
.qty{display:flex;align-items:center;border:1px solid var(--line);border-radius:99px}
.qty button{width:30px;height:30px;font-size:16px}
.qty span{min-width:20px;text-align:center;font-size:14px}
.empty{text-align:center;color:var(--muted);padding:60px 10px}
.empty img{height:60px;margin:0 auto 14px;opacity:.8}
.df{padding:18px 22px 22px;border-top:1px solid var(--line);background:#fbf7ef}
.df label{font-size:13px;color:var(--muted);display:block;margin:8px 0 4px}
.df select,.df input,.df textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;font-size:14px;background:#fff}
.df .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sum{margin:14px 0;font-size:14px}
.sum .row{padding:3px 0}
.sum .tot{font-size:18px;font-weight:600;border-top:1px solid var(--line);padding-top:8px;margin-top:6px}
.wa{width:100%;justify-content:center;background:#1f9d55;color:#fff}
.wa:hover{background:#178246}
.err{color:#b3261e;font-size:13px;margin-top:6px;min-height:18px}

/* modal */
.modal{position:fixed;inset:0;display:grid;place-items:center;z-index:80;opacity:0;pointer-events:none;transition:.25s;padding:20px}
.modal.on{opacity:1;pointer-events:auto}
.mbox{background:var(--paper);border-radius:22px;max-width:440px;width:100%;padding:30px;text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.4)}
.mbox img{height:70px;margin:0 auto 10px}
.mbox h3{font-size:24px;margin-bottom:8px}
.mbox p{color:var(--muted);font-size:14px;margin-bottom:16px}
.mbox pre{white-space:pre-wrap;text-align:start;background:#f3eee4;border-radius:12px;padding:14px;font-family:inherit;font-size:13px;max-height:220px;overflow:auto;margin-bottom:16px}
.mbox .cta{justify-content:center;margin-top:0}

.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,30px);background:var(--navy);color:var(--gold2);padding:12px 22px;border-radius:99px;font-size:14px;opacity:0;transition:.3s;z-index:90;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
.fab{position:fixed;bottom:22px;inset-inline-start:22px;z-index:50;background:#1f9d55;color:#fff;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;box-shadow:0 10px 26px rgba(0,0,0,.25)}

@media(max-width:900px){
  .links{display:none}
  .hero .wrap,.events .wrap{grid-template-columns:1fr}
  .hero .wrap{text-align:center;padding-top:40px}
  .hero p{margin:0 auto}.eyebrow{justify-content:center}.cta,.stats{justify-content:center}
  .heroimg{width:min(330px,90%);margin-top:10px}
  .steps,.reviews{grid-template-columns:1fr}
  .fgrid{grid-template-columns:1fr 1fr}
  .insta{grid-template-columns:repeat(3,1fr)}.insta img:nth-child(n+4){display:none}
  .brand b{display:none}
  section{padding:64px 0}
}
@media(max-width:520px){.elist{grid-template-columns:1fr}.mosaic img{height:160px}.mosaic img:first-child{height:332px}.cartbtn .lbl{display:none}}
</style>
</head>

};
const DELIV=[1.5,1.5,2,2,2.5,3];
const P=[

  n:{ar:"كيندر ملت براونيز",en:"Kinder Melt Brownies"},d:{ar:"براونيز غني محشي شوكولاتة كيندر تذوب مع كل قضمة.",en:"Fudgy brownies loaded with melting Kinder chocolate."},
  o:[{ar:"بوكس ٦ قطع",en:"Box of 6",p:6.5},{ar:"بوكس ١٢ قطعة",en:"Box of 12",p:12}]},
 {id:"dates",cat:"cakes",img:"dates.jpg",tag:{ar:"جديد",en:"New"},
  n:{ar:"ديت بليس",en:"Date Bliss"},d:{ar:"مربعات كيك التمر الطري مع لمسة كراميل — رفيقة القهوة العربية.",en:"Soft date-cake bites with a caramel touch — made for Arabic coffee."},
  o:[{ar:"بوكس ٩ قطع",en:"Box of 9",p:5.5},{ar:"بوكس ١٦ قطعة",en:"Box of 16",p:9.5}]},
 {id:"icecream",cat:"cakes",img:"icecream.jpg",tag:{ar:"خاص لك",en:"Just for you"},
  n:{ar:"كيكة آيس كريم ساندويتش",en:"Ice Cream Sandwich Cake"},d:{ar:"طبقات بسكويت شوكولاتة وآيس كريم فانيلا مع صوص الشوكولاتة.",en:"Chocolate cookie layers, vanilla ice cream and a chocolate drip."},
  o:[{ar:"حجم صغير (٤-٦ أشخاص)",en:"Small (4–6)",p:9},{ar:"حجم كبير (٨-١٠ أشخاص)",en:"Large (8–10)",p:15}]},
 {id:"croissant",cat:"pastry",img:"croissant.jpg",

  o:[{ar:"٤ حبات",en:"Pack of 4",p:3.5},{ar:"٨ حبات",en:"Pack of 8",p:6.5}]},
 {id:"cheese",cat:"boxes",img:null,tag:{ar:"للتجمعات",en:"For gatherings"},
  n:{ar:"تشيز بلاتر",en:"Cheese Platter"},d:{ar:"أجبان مختارة مع فواكه، مكسرات ومعجنات — مثالي للصباحات والجمعات.",en:"Selected cheeses with fruit, nuts and pastries — perfect for mornings & gatherings."},
  o:[{ar:"وسط (٦-٨ أشخاص)",en:"Medium (6–8)",p:18},{ar:"كبير (١٠-١٥ شخص)",en:"Large (10–15)",p:28}]},
 {id:"mix",cat:"boxes",img:null,
  n:{ar:"بوكس الضيافة المشكل",en:"Signature Mix Box"},d:{ar:"تشكيلة من براونيز، ديت بليس وميني كرواسون في بوكس هدية أنيق.",en:"A mix of brownies, Date Bliss and mini croissants in an elegant gift box."},

];
let lang="ar",filter="all",cart=[];
try{cart=JSON.parse(localStorage.getItem("bd_cart")||"[]");lang=localStorage.getItem("bd_lang")||"ar"}catch(e){}
const $=s=>document.querySelector(s);
const t=k=>T[lang][k];
const fmt=v=>(lang==="ar"?v.toFixed(3)+" "+t("kd"):t("kd")+" "+v.toFixed(3));
function save(){try{localStorage.setItem("bd_cart",JSON.stringify(cart));localStorage.setItem("bd_lang",lang)}catch(e){}}
function applyLang(){
  document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";
  document.querySelectorAll("[data-t]").forEach(el=>{const v=t(el.dataset.t);if(el.hasAttribute("data-html"))el.innerHTML=v;else el.textContent=v});
  $("#lang").textContent=lang==="ar"?"EN":"عربي";
  $("#checkout").textContent=t("checkout");
  const a=$("#cArea"),cur=a.selectedIndex;a.innerHTML=t("areas").map((x,i)=>`<option value="${i}">${x}</option>`).join("");a.selectedIndex=cur<0?0:cur;
  renderFilters();renderGrid();renderCart();save();
}
function renderFilters(){
  $("#filters").innerHTML=["all","brownies","cakes","pastry","boxes"].map(c=>`<button class="chip ${c===filter?"on":""}" data-c="${c}">${t(c)}</button>`).join("");
}
function picHtml(p,cls){return p.img?`<img src="${p.img}" alt="">`:`<img src="emblem-t.png" alt=""><div class="lbl">${p.n.en.toUpperCase()}</div>`}
function renderGrid(){
  $("#grid").innerHTML=P.filter(p=>filter==="all"||p.cat===filter).map(p=>`
   <article class="card">
     <div class="pic ${p.img?"":"navy"}">${picHtml(p)}${p.tag?`<span class="tag">${p.tag[lang]}</span>`:""}</div>
     <div class="body">
       <h3 class="display">${p.n[lang]}</h3><p>${p.d[lang]}</p>
       <div class="opts"><select id="o-${p.id}">${p.o.map((o,i)=>`<option value="${i}">${o[lang]} — ${fmt(o.p)}</option>`).join("")}</select></div>
       <div class="row"><span class="price" id="pr-${p.id}">${fmt(p.o[0].p)}</span><button class="add" data-id="${p.id}">${t("add")}</button></div>
     </div></article>`).join("");
}
function renderCart(){
  const n=cart.reduce((a,c)=>a+c.q,0);$("#count").textContent=n;
  if(!cart.length){$("#items").innerHTML=`<div class="empty"><img src="emblem-t.png" alt="" style="filter:brightness(.8)">${t("empty")}</div>`;$("#df").style.display="none";return}
  $("#df").style.display="";
  $("#items").innerHTML=cart.map((c,i)=>{const p=P.find(x=>x.id===c.id),o=p.o[c.o];return `
   <div class="it">${p.img?`<img src="${p.img}" alt="">`:`<div class="ph"><img src="emblem-t.png" alt=""></div>`}
    <div class="t"><b>${p.n[lang]}</b><span>${o[lang]} · ${fmt(o.p)}</span></div>
    <div class="qty"><button data-i="${i}" data-d="-1">−</button><span>${c.q}</span><button data-i="${i}" data-d="1">+</button></div></div>`}).join("");
  const sub=total(),d=DELIV[+$("#cArea").value||0];
  $("#sub").textContent=fmt(sub);$("#del").textContent=fmt(d);$("#tot").textContent=fmt(sub+d);
}
function total(){return cart.reduce((a,c)=>a+P.find(x=>x.id===c.id).o[c.o].p*c.q,0)}
function toast(m){const e=$("#toast");e.textContent=m;e.classList.add("on");clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove("on"),1600)}
function openCart(v){$("#drawer").classList.toggle("on",v);$("#ov").classList.toggle("on",v)}

document.addEventListener("click",e=>{
  const ch=e.target.closest(".chip");if(ch){filter=ch.dataset.c;renderFilters();renderGrid();return}
  const ad=e.target.closest(".add");if(ad){const id=ad.dataset.id,o=+$("#o-"+id).value;const f=cart.find(c=>c.id===id&&c.o===o);f?f.q++:cart.push({id,o,q:1});save();renderCart();toast(t("added"));const b=$("#openCart");b.classList.remove("bump");void b.offsetWidth;b.classList.add("bump");return}
  const q=e.target.closest(".qty button");if(q){const i=+q.dataset.i;cart[i].q+=+q.dataset.d;if(cart[i].q<1)cart.splice(i,1);save();renderCart();return}
});
document.addEventListener("change",e=>{if(e.target.id&&e.target.id.startsWith("o-")){const id=e.target.id.slice(2),p=P.find(x=>x.id===id);$("#pr-"+id).textContent=fmt(p.o[+e.target.value].p)}if(e.target.id==="cArea")renderCart()});
$("#lang").onclick=()=>{lang=lang==="ar"?"en":"ar";applyLang()};
$("#openCart").onclick=()=>openCart(true);$("#closeCart").onclick=$("#ov").onclick=()=>openCart(false);
$("#mClose").onclick=()=>$("#modal").classList.remove("on");
$("#eventBtn").onclick=()=>{$("#mMsg").textContent=t("evMsg");$("#mWa").href=`https://wa.me/${WA}?text=${encodeURIComponent(t("evMsg"))}`;$("#modal").classList.add("on")};
const dt=$("#cDate");const tm=new Date(Date.now()+864e5);dt.min=tm.toISOString().slice(0,10);
$("#checkout").onclick=()=>{
  const name=$("#cName").value.trim(),ph=$("#cPhone").value.trim();
  if(!name||!ph){$("#err").textContent=t("errName");return}
  if(!dt.value){$("#err").textContent=t("errDate");return}
  $("#err").textContent="";
  const ai=+$("#cArea").value,d=DELIV[ai],sub=total();
  let m=`🧁 ${t("msgHead")}\n\n`;
  cart.forEach(c=>{const p=P.find(x=>x.id===c.id),o=p.o[c.o];m+=`• ${p.n[lang]} (${o[lang]}) × ${c.q} = ${fmt(o.p*c.q)}\n`});
  m+=`\n${t("sub")}: ${fmt(sub)}\n${t("del")}: ${fmt(d)}\n${t("tot")}: ${fmt(sub+d)}\n\n${t("mName")}: ${name}\n${t("mPhone")}: ${ph}\n${t("mArea")}: ${t("areas")[ai]}\n${t("mDate")}: ${dt.value}`;
  const nt=$("#cNotes").value.trim();if(nt)m+=`\n${t("mNotes")}: ${nt}`;
  $("#mMsg").textContent=m;$("#mWa").href=`https://wa.me/${WA}?text=${encodeURIComponent(m)}`;
  openCart(false);$("#modal").classList.add("on");
};
applyLang();
</script>
